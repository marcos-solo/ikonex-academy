name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install dependencies
      run: npm install
    
    - name: Run security audit
      run: npm audit --audit-level=moderate || true
    
    - name: Check for secrets in code
      run: |
        git grep -E '(password|secret|token|key).*=[^.]' || echo "No secrets found"

  dependency-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Check outdated packages
      run: npm outdated || echo "All packages up to date"

  build-test:
    runs-on: ubuntu-latest
    needs: [security-scan]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Backend build check
      run: |
        npm install
        node -e "require('./server.js')" & sleep 3 && kill %1 || echo "Server started"
    
    - name: Frontend build
      run: |
        cd frontend
        npm install
        npm run build
